name: FurimaKakakuCheck
options:
  bundleIdPrefix: jp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FurimaKakakuCheck:
    type: application
    platform: iOS
    sources:
      - path: nemiru-iphone
    settings:
      base:
        INFOPLIST_FILE: nemiru-iphone/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: jp.nemiru.iphone
        PRODUCT_NAME: FurimaKakakuCheck
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
schemes:
  FurimaKakakuCheck:
    build:
      targets:
        FurimaKakakuCheck: all
