name: NemiruCamera
options:
  bundleIdPrefix: jp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NemiruCamera:
    type: application
    platform: iOS
    sources:
      - path: NemiruCamera
    settings:
      base:
        INFOPLIST_FILE: NemiruCamera/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: jp.nemiru.camera
        PRODUCT_NAME: NemiruCamera
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
schemes:
  NemiruCamera:
    build:
      targets:
        NemiruCamera: all
